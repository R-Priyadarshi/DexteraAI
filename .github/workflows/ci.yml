name: CI

# This file replaces the earlier pair of workflows. `ci.yml` and `ultra_ci.yml`
# both linted, type-checked and tested the same tree under two different names,
# so a green "DexteraAI CI" sat next to a red "CI" and it was not obvious that
# the two disagreed — or which one a fix had to satisfy.
#
# Everything here has been run. Steps that could not pass have been removed
# rather than left in place looking like coverage:
#
#   - Docker build + push to Docker Hub, using DOCKERHUB_TOKEN and
#     DOCKERHUB_USERNAME. Neither secret is configured, so `docker login`
#     received an empty username and the job failed on every run.
#   - Slack failure notification, passing `slack_webhook_url` — not an input of
#     8398a7/action-slack@v3, which reads SLACK_WEBHOOK_URL from `env`. No
#     webhook is configured either.
#   - Trivy filesystem scan, pinned to `@master` (an unpinned third-party
#     action). For a Python tree it largely duplicates the bandit step below,
#     and a scan across the torch/mediapipe dependency graph reports CVEs this
#     project has no path to fix. bandit is the gate we can actually hold, and
#     it has already caught two real findings.
#   - Codecov upload, which needs a token this repository does not have.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs are cancelled as a group, so pushing a fix does not leave a
# scatter of half-finished jobs next to the new ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HAND_LANDMARKER_URL: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
  POSE_LANDMARKER_URL: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"

jobs:
  lint:
    name: Lint, types, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check core/ training/ tests/ bridge/

      - name: MyPy
        run: mypy core/ training/ bridge/

      # bandit lives in the `dev` extra. It used to be listed here but
      # installed nowhere, so this step failed on a missing command rather than
      # on any finding — the scan had never run against this repository.
      - name: Bandit
        run: bandit -r core/ training/ backend/ bridge/ --skip B101,B102,B103

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every cell. A failure on 3.12 should not hide the 3.11 result.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # `[api]` too: tests/test_api.py boots the real FastAPI app, and without
      # the extra its import is a collection error, which aborts the entire
      # run rather than skipping one module.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Fetch MediaPipe bundles
        run: |
          mkdir -p models/mediapipe
          curl -sSL --retry 3 -o models/mediapipe/hand_landmarker.task "$HAND_LANDMARKER_URL"
          curl -sSL --retry 3 -o models/mediapipe/pose_landmarker_lite.task "$POSE_LANDMARKER_URL"

      # Benchmarks are excluded here and run in their own job: they assert
      # timing budgets, and a shared runner under six parallel jobs is the
      # worst place to measure.
      - name: Tests
        run: pytest tests/ -m "not slow and not gpu and not benchmark" --tb=short

  smoke:
    name: End-to-end wiring
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,training,bridge]"

      - name: Fetch MediaPipe bundles
        run: |
          mkdir -p models/mediapipe
          curl -sSL --retry 3 -o models/mediapipe/hand_landmarker.task "$HAND_LANDMARKER_URL"
          curl -sSL --retry 3 -o models/mediapipe/pose_landmarker_lite.task "$POSE_LANDMARKER_URL"

      # These catch what unit tests cannot: modules that each pass in isolation
      # while calling one another with mismatched signatures. Three such
      # mismatches shipped at once before this job existed.
      - name: CLI boots
        run: python dextera.py info

      - name: Training loop runs end to end
        run: python dextera.py train --synthetic --epochs 2 --batch-size 64

      - name: Pipeline and API wiring
        run: pytest tests/test_pipeline.py tests/test_api.py --tb=short

  benchmark:
    name: Latency benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The budgets are asserted inside the tests, against a fraction of a
      # 30fps frame. That keeps the gate self-contained: the previous version
      # of this job depended on benchmark-action storing history in a gh-pages
      # branch that was never set up.
      - name: Run benchmarks
        run: pytest tests/test_benchmarks.py -m benchmark --benchmark-only --benchmark-json=benchmark.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json
          if-no-files-found: warn

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # `models/` is where training writes; `public/onnx/` is what the browser
      # fetches. They are separate copies, so recalibrating updates one and
      # leaves the other stale — the app keeps working while silently falling
      # back to a generic confidence threshold. The weights themselves are DVC
      # outputs and are not in git, so what this compares in CI is the
      # `labels.json` of each bundle, which is where the calibration lives and
      # where the drift actually happened.
      - name: Served bundles match models/
        working-directory: ${{ github.workspace }}
        run: scripts/sync_bundles.sh --check
