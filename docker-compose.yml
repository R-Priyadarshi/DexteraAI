# ============================================================
#  Dextera AI — Docker Compose
# ============================================================
version: "3.9"

services:
  dextera:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dextera-ai
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - LOG_FORMAT=%(asctime)s %(levelname)s %(message)s
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - dextera-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dextera-logs:
