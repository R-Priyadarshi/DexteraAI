name: "DexteraAI CI"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  HAND_LANDMARKER_URL: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
  POSE_LANDMARKER_URL: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy core/

      - name: Fetch MediaPipe model bundle
        run: |
          mkdir -p models/mediapipe
          curl -sSL --retry 3 -o models/mediapipe/hand_landmarker.task "$HAND_LANDMARKER_URL"
          curl -sSL --retry 3 -o models/mediapipe/pose_landmarker_lite.task "$POSE_LANDMARKER_URL"
          ls -lh models/mediapipe/

      - name: Tests
        run: pytest tests/ -m "not slow" --tb=short

  smoke:
    name: End-to-end wiring smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,training]"

      - name: Fetch MediaPipe model bundle
        run: |
          mkdir -p models/mediapipe
          curl -sSL --retry 3 -o models/mediapipe/hand_landmarker.task "$HAND_LANDMARKER_URL"
          curl -sSL --retry 3 -o models/mediapipe/pose_landmarker_lite.task "$POSE_LANDMARKER_URL"

      # These catch the class of bug that unit tests miss: modules that pass in
      # isolation but call each other with mismatched APIs.
      - name: CLI boots
        run: python dextera.py info

      - name: Training loop runs end to end
        run: python dextera.py train --synthetic --epochs 2 --batch-size 64

      - name: Pipeline and API wiring
        run: pytest tests/test_pipeline.py tests/test_api.py --tb=short

  web:
    name: Web app build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
